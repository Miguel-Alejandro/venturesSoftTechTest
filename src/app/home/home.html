<app-header></app-header>
<main class="home ">
    <section class="home__title">
        <app-title [title]="homeTitle"></app-title>
        <app-benefits-table></app-benefits-table>
    </section>

    <section class="home__categories">
        <app-title [title]="cuponsTitle" size="medium"></app-title>
        <app-category (categorySelected)="categorySelected($event)"></app-category>
    </section>

    <div class="home__instant-coupons">
        <app-instant-coupons-cards [idMenu]="idMenu()"></app-instant-coupons-cards>
    </div>

    <div class="home__cashback">
        <app-cashback></app-cashback>
    </div>

    <div class="home__footer">
        <app-footer></app-footer>
    </div>
</main>
