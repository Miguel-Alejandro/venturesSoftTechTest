<div class="benefits-table">
  <table mat-table [dataSource]="dataSource" class="mat-shadow-2">
   
    <ng-container matColumnDef="benefitName">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">{{ element.benefitName }}</td>
    </ng-container>

    <ng-container matColumnDef="noCardLinkingRequired">
      <th mat-header-cell *matHeaderCellDef>No Card Linking Required</th>
      <td class="table--center--text" mat-cell *matCellDef="let element">
        @if(element.noCardLinkingRequired){  <mat-icon class="icon-check valid--check">check_circle</mat-icon> }
    </td>
    </ng-container>


    <ng-container matColumnDef="linkYourCardGoGet">
      <th mat-header-cell *matHeaderCellDef>Link Your Card Go Get</th>
      <td class="table--center--text" mat-cell *matCellDef="let element">
        @if(element.linkYourCardGoGet){  <mat-icon class="icon-check valid--check">check_circle</mat-icon> }
    </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <div class="benefits-table__actions">
    <button class="link-your-card primary--button" matButton="filled">
        LINK YOUR CARD
        <mat-icon iconPositionEnd>chevron_right</mat-icon>
    </button>
  </div>
</div>
